name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce vocabulary, language model, ranker and evaluation splits
        run: |
          python3 tools/train_typing_ranker.py
          python3 tools/import_manglish.py
          python3 tools/verify_typing_assets.py
          git diff --exit-code -- app/src/main/assets/dictionaries/ app/src/test/resources/typing-generated.json app/src/test/resources/manglish-cases.json tools/typing-training-manifest.json
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/autocorrect/

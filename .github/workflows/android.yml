name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Reproduce baseline and evaluation splits
        run: |
          python3 tools/train_typing_ranker.py
          git diff --exit-code -- app/src/main/assets/dictionaries/ranker-baseline.tsv app/src/test/resources/typing-generated.json tools/typing-training-manifest.json
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/autocorrect/
      - name: Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeRight-191.0-internal-learning-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
